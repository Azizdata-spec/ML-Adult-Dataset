<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analyse de profils</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">Analyse de profils</span>
    <div class="navbar-nav flex-row gap-3">
      <a class="nav-link" href="/">Fiche profil</a>
      <a class="nav-link" href="/batch">Analyse en lot</a>
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% if engine_missing %}
  <div class="alert alert-warning">Modèles non chargés (fichier absent dans <code>models/</code>) : {{ engine_missing | join(", ") }}</div>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
